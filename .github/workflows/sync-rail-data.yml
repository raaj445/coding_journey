name: Sync Railway Timetable Data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build-rail-data.mjs"
      - ".github/workflows/sync-rail-data.yml"
  schedule:
    - cron: "17 21 * * 0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build compact railway index
        run: node scripts/build-rail-data.mjs

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rail
          if git diff --cached --quiet; then
            echo "Railway data is already up to date."
            exit 0
          fi
          git commit -m "chore: sync railway timetable data"
          git push
